plugins {
    id 'com.gradleup.shadow'
}

architectury {
    platformSetupLoomIde()
    neoForge()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

repositories {
    maven {url = 'https://maven.neoforged.net/releases'}
    maven {url = "https://api.modrinth.com/maven"}
}

dependencies {
    neoForge "net.neoforged:neoforge:$rootProject.neoforge_version"
    implementation "dev.architectury:architectury-neoforge:$rootProject.architectury_api_version"
    include "dev.architectury:architectury-neoforge:$rootProject.architectury_api_version"

    // Midnight lib
    implementation "maven.modrinth:codAaoxh:WQfVY6eb"
    include "maven.modrinth:codAaoxh:WQfVY6eb"

    common(project(':common')) { transitive false }
    shadowBundle project(path: ':common', configuration: 'transformProductionNeoForge')
}


processResources {
    def properties = [
            maven_group              : rootProject.maven_group,
            modid                    : rootProject.modid,
            mod_name                 : rootProject.archives_name,
            mod_version              : project.version,
            author                   : rootProject.author,
            description              : rootProject.description,
            homepage_url             : rootProject.homepage_url,
            issues_url               : rootProject.issues_url,
            license                  : rootProject.license,
            java_version             : rootProject.java_version,
            neoforge_version         : rootProject.neoforge_version,
            minecraft_version        : rootProject.minecraft_version,
            architectury_api_version : rootProject.architectury_api_version,
            midnightlib_version      : rootProject.midnightlib_version
    ]

    inputs.properties properties

    filesMatching('META-INF/neoforge.mods.toml') {
        expand properties
    }
}

jar {
    archiveClassifier = 'dev'
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = ''   // this is the final, distributable jar
}

assemble.dependsOn shadowJar

"dev.architectury:architectury-fabric:$rootProject.architectury_api_version"

tasks.register("extractRemappedJar", Copy) {
    dependsOn("shadowJar")

    from(zipTree(tasks.named("shadowJar").flatMap { it.archiveFile }))
    into(layout.buildDirectory.dir("tmp/remapped"))

    exclude 'data/**'
    exclude 'assets/**'
}

tasks.register("jarProduction", Jar) {
    group = "build"
    description = "Build production JAR for NeoForge using stripped common resources"

    dependsOn(":common:jarProduction", "extractRemappedJar")

    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    // Include extracted remapped content
    from(layout.buildDirectory.dir("tmp/remapped"))

    // Include stripped resources
    from(project(':common').file('tmp')) {
        include 'data/**'
        include 'assets/**'
    }

    doLast {
        delete(layout.buildDirectory.dir("tmp/remapped"))
    }
}
